<html><head><meta charset="utf-8"><link rel="stylesheet" href="dia.css"><style>:root{--bg:#07111f;--fg:#eaf4ff;--ac:#4dabf7}
.row{display:flex;gap:22px}
.c{flex:1;background:#0f2036;border:2px solid #1e3a5c;border-radius:24px;padding:26px 22px;text-align:center}
.c.hot{border-color:var(--ac);box-shadow:0 0 36px rgba(77,171,247,.22)}
.t{font-size:32px;font-weight:900;margin-bottom:18px}.t small{display:block;font-size:21px;color:#9cc7ee;font-weight:700;margin-top:4px}

.r{display:grid;grid-template-columns:76px 1fr;gap:6px;text-align:left;font-size:20px;line-height:1.45;margin-top:8px;white-space:nowrap}
.r b{color:var(--ac)}
</style></head><body><div id="card">

</div>
