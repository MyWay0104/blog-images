<html><head><meta charset="utf-8"><link rel="stylesheet" href="dia.css"><style>:root{--bg:#1c0a12;--fg:#fff0f6;--ac:#f783ac}
.blk{background:#2a1020;border:2px solid #4a1c36;border-radius:22px;padding:22px 26px;margin-bottom:18px}
.blk.hot{border-color:var(--ac)}
.t{font-size:30px;font-weight:900;margin-bottom:14px}.t span{color:var(--ac)}
.tl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;align-items:center}
.nm{font-size:22px;color:#e8b4c8}
.trk{height:34px;background:#3a1526;border-radius:8px;position:relative}
.seg{position:absolute;top:0;height:34px;border-radius:8px;background:var(--ac);opacity:.85}
.seg.g{background:#8a4a68}
.tot{margin-top:12px;font-size:25px;font-weight:900;text-align:right}
.ax{display:flex;justify-content:space-between;font-size:20px;color:#e8b4c8;margin-top:6px;padding-left:164px}
</style></head><body><div id="card">
<div class="k">함정</div><h1>async def만 붙이면 비동기가 아니다</h1>
<div class="blk"><div class="t"><span>X</span> 동기 함수를 그대로 호출 — 서버가 멈추고 차례로 돈다</div>
<div class="tl">
<div class="nm">독서 기록</div><div class="trk"><div class="seg g" style="left:0;width:25%"></div></div>
<div class="nm">책 정보</div><div class="trk"><div class="seg g" style="left:25%;width:25%"></div></div>
<div class="nm">메모</div><div class="trk"><div class="seg g" style="left:50%;width:25%"></div></div>
<div class="nm">리뷰</div><div class="trk"><div class="seg g" style="left:75%;width:25%"></div></div>
</div><div class="ax"><span>0초</span><span>8초</span></div><div class="tot">합계 8초 · gather 로 묶어도 똑같다</div></div>
<div class="blk hot"><div class="t"><span>O</span> asyncio.to_thread 로 감싸서 gather — 대기가 겹친다</div>
<div class="tl">
<div class="nm">독서 기록</div><div class="trk"><div class="seg" style="left:0;width:25%"></div></div>
<div class="nm">책 정보</div><div class="trk"><div class="seg" style="left:0;width:37%"></div></div>
<div class="nm">메모</div><div class="trk"><div class="seg" style="left:0;width:20%"></div></div>
<div class="nm">리뷰</div><div class="trk"><div class="seg" style="left:0;width:30%"></div></div>
</div><div class="ax"><span>0초</span><span>8초</span></div><div class="tot" style="color:var(--ac)">가장 느린 하나 · 약 3초</div></div>
<div style="text-align:center;font-size:24px;color:#e8b4c8">효과는 I/O 대기가 긴 작업이 여러 개일 때만. CPU 계산 구간에서는 없다</div>
</div></body></html>
