<html><head><meta charset="utf-8"><link rel="stylesheet" href="dia.css"><style>:root{--bg:#1a0808;--fg:#fff1f0;--ac:#ff6b6b}
.lane{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.tag{width:120px;font-size:24px;font-weight:900;color:var(--ac)}
.b{flex:1 1 0;min-width:0;background:#2a1010;border:3px solid #5a2222;border-radius:18px;padding:14px 8px;text-align:center;font-size:20px;line-height:1.4;color:#ffd6d6}
.b b{display:block;font-size:23px;color:#fff;margin-bottom:4px}
.b.hot{border-color:var(--ac);box-shadow:0 0 30px rgba(255,107,107,.25)}
.ar{color:var(--ac);font-size:28px;font-weight:900}
.note{margin-top:10px;font-size:25px;text-align:center;color:#ffd6d6;line-height:1.6}
.note b{color:var(--ac)}
</style></head><body><div id="card">
<div class="k">같은 click, 결과가 가는 곳이 다르다</div><h1>라이브러리 vs MCP</h1>
<div class="lane"><div class="tag">라이브러리</div>
<div class="b"><b>내 코드</b>page.click()</div><div class="ar">▶</div>
<div class="b"><b>브라우저</b>동작 수행</div><div class="ar">▶</div>
<div class="b hot"><b>내 코드 변수</b>page.content()<br>원본 그대로</div><div class="ar">▶</div>
<div class="b hot"><b>파일 · DB</b>코드가 저장<br>다음 동작도 결정</div></div>
<div class="lane"><div class="tag">MCP</div>
<div class="b"><b>LLM</b>browser_click 호출</div><div class="ar">▶</div>
<div class="b"><b>MCP 서버</b>브라우저 동작</div><div class="ar">▶</div>
<div class="b hot"><b>LLM 컨텍스트</b>스냅샷<br>의미만 남긴 요약</div><div class="ar">▶</div>
<div class="b hot"><b>LLM이 결정</b>무엇을 저장할지<br>다음 동작</div></div>
<div class="note">위는 <b>결정론</b>(같은 입력 → 같은 출력), 아래는 <b>비결정론</b>.<br>크롤링에서 정보가 빠지는 자리는 <b>"요약"</b>이 들어가는 세 번째 칸이다.</div>
</div></body></html>
